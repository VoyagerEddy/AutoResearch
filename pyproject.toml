[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-local"
version = "0.3.0"
description = "A local, human-supervised research and remote experiment agent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2.1,<3",
  "paramiko>=3.5,<4",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
autoresearch = "autoresearch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
